<!DOCTYPE html>
<html>
<head><title>OG / Social Preview Generator — MultiMian ImageKit</title>
<style>
  body { font-family: system-ui; padding: 24px; background: #0f172a; color: #fff; }
  canvas { border-radius: 12px; margin: 16px 0; max-width: 100%; border: 1px solid rgba(255,255,255,0.1); display: block; }
  button { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; margin: 8px 4px; }
  button:hover { background: #15803d; }
  .formats { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  h2 { color: #6ee7b7; margin-bottom: 4px; }
  p  { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }
</style>
</head>
<body>
<h2>MultiMian ImageKit — Social Preview Generator</h2>
<p>Generates the GitHub OG image (1280×640) and Twitter card. Save as <code>social-preview.png</code> in the repo root.</p>

<div class="formats">
  <button onclick="generate('github')">📦 GitHub OG (1280×640)</button>
  <button onclick="generate('twitter')">🐦 Twitter Card (1200×630)</button>
  <button onclick="generate('linkedin')">💼 LinkedIn (1200×627)</button>
  <button onclick="downloadAll()">⬇ Download All</button>
</div>

<canvas id="c"></canvas>
<p id="info" style="color:#64748b; font-size:13px;"></p>

<script>
const CONFIGS = {
  github:   { w: 1280, h: 640,  name: 'social-preview.png' },
  twitter:  { w: 1200, h: 630,  name: 'twitter-card.png' },
  linkedin: { w: 1200, h: 627,  name: 'linkedin-preview.png' },
};

function generate(type) {
  const cfg = CONFIGS[type];
  render(cfg.w, cfg.h, true, cfg.name);
}

function render(W, H, download = false, filename = 'social-preview.png') {
  const c = document.getElementById('c');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // Background
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#080b12');
  bg.addColorStop(0.5, '#0d1526');
  bg.addColorStop(1, '#080b12');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Glow orbs
  addGlow(ctx, W * 0.15, H * 0.3, W * 0.4, 'rgba(22,163,74,0.18)');
  addGlow(ctx, W * 0.85, H * 0.6, W * 0.35, 'rgba(99,102,241,0.15)');
  addGlow(ctx, W * 0.5, H * 0.1, W * 0.3, 'rgba(14,165,233,0.1)');

  // Top shimmer line
  const line = ctx.createLinearGradient(0, 0, W, 0);
  ['#16a34a','#0ea5e9','#6366f1','#a78bfa','#16a34a'].forEach((c2, i) => line.addColorStop(i / 4, c2));
  ctx.fillStyle = line; ctx.fillRect(0, 0, W, 4);

  // Logo mark (stylized M in a rounded square)
  const lx = 64, ly = H * 0.5 - 40;
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  roundRect(ctx, lx, ly - 10, 76, 76, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5;
  roundRect(ctx, lx, ly - 10, 76, 76, 18); ctx.stroke();
  ctx.fillStyle = '#6ee7b7';
  ctx.font = 'bold 52px system-ui'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText('M', lx + 16, ly + 28);

  // Project name
  const nx = lx + 96;
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.round(W * 0.048)}px system-ui`;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('MultiMian', nx, H * 0.5 - 2);

  // Gradient "ImageKit"
  const ikGrad = ctx.createLinearGradient(nx, 0, nx + 400, 0);
  ikGrad.addColorStop(0, '#6ee7b7');
  ikGrad.addColorStop(0.5, '#60a5fa');
  ikGrad.addColorStop(1, '#a78bfa');
  ctx.fillStyle = ikGrad;
  ctx.font = `bold ${Math.round(W * 0.048)}px system-ui`;
  ctx.fillText('ImageKit', nx + ctx.measureText('MultiMian').width + 14, H * 0.5 - 2);

  // Tagline
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = `500 ${Math.round(W * 0.022)}px system-ui`;
  ctx.fillText('The privacy-first, browser-based creative toolkit', lx, H * 0.5 + 44);

  // Stats row
  const stats = [
    { icon: '🛠', val: '17', lbl: 'Tools' },
    { icon: '🔒', val: '0', lbl: 'Uploads' },
    { icon: '📡', val: 'PWA', lbl: 'Offline' },
    { icon: '🆓', val: '100%', lbl: 'Free' },
  ];
  const statY = H * 0.72;
  const statW = Math.min(180, (W - lx * 2) / stats.length - 16);
  stats.forEach((s, i) => {
    const sx = lx + i * (statW + 16);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    roundRect(ctx, sx, statY, statW, 70, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
    roundRect(ctx, sx, statY, statW, 70, 12); ctx.stroke();
    // icon
    ctx.font = `${Math.round(W * 0.025)}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.icon, sx + statW / 2, statY + 20);
    // value
    const valGrad = ctx.createLinearGradient(sx, 0, sx + statW, 0);
    valGrad.addColorStop(0, '#16a34a'); valGrad.addColorStop(1, '#0ea5e9');
    ctx.fillStyle = valGrad;
    ctx.font = `bold ${Math.round(W * 0.022)}px system-ui`;
    ctx.fillText(s.val, sx + statW / 2, statY + 40);
    // label
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = `${Math.round(W * 0.014)}px system-ui`;
    ctx.fillText(s.lbl, sx + statW / 2, statY + 57);
  });

  // Right side — tool chips
  const tools = ['🗜 Compress','✂️ Resize','✂️ Crop','🔄 Convert','🔤 OCR','📄 PDF','🎞 GIF','⬛ QR Code','🪪 Passport','🌐 Favicon','💧 Watermark','🔗 Merge','🎬 Video→GIF','🎨 Sticker','✨ Screenshot','📝 Text Studio','🌐 Share'];
  const chipStartX = W * 0.58, chipY0 = H * 0.14;
  const chipW = 148, chipH = 32, gap = 10;
  const cols = 3;
  ctx.font = `600 ${Math.round(W * 0.014)}px system-ui`;
  tools.forEach((tool, i) => {
    if (i >= 15) return; // show 15
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx2 = chipStartX + col * (chipW + gap);
    const cy2 = chipY0 + row * (chipH + gap);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    roundRect(ctx, cx2, cy2, chipW, chipH, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
    roundRect(ctx, cx2, cy2, chipW, chipH, 8); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(tool, cx2 + 10, cy2 + chipH / 2);
  });

  // URL watermark
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = `500 ${Math.round(W * 0.016)}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('mianhassam96.github.io/MultiMian-ImageKit/', lx, H - 22);

  // Bottom shimmer line
  ctx.fillStyle = line; ctx.fillRect(0, H - 4, W, 4);

  document.getElementById('info').textContent = `Preview: ${W}×${H}px — will be saved as ${filename}`;

  if (download) {
    c.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    }, 'image/png');
  }
}

function addGlow(ctx, x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

async function downloadAll() {
  for (const [type, cfg] of Object.entries(CONFIGS)) {
    render(cfg.w, cfg.h, true, cfg.name);
    await new Promise(r => setTimeout(r, 400));
  }
}

// Auto-render GitHub preview on load
window.onload = () => render(1280, 640, false, 'social-preview.png');
</script>
</body>
</html>
